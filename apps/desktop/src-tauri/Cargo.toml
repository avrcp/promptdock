[package]
name = "promptdock-desktop"
version = "0.1.0"
description = "Codex 桌面宿主启动与 Relay 微信通知工具"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "promptdock_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
fs2 = "0.4"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tokio = { version = "1", features = ["macros", "process", "io-util", "signal", "sync", "time", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
url = "2"
zeroize = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tempfile = "3"

[dev-dependencies]
wiremock = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_Security_Cryptography",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
