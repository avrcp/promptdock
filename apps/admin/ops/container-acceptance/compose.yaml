services:
  fixture:
    image: node:22-bookworm-slim
    working_dir: /workspace
    command: ['node', 'scripts/admin-fixture-server.mjs']
    environment:
      ADMIN_FIXTURE_HOST: '0.0.0.0'
      ADMIN_FIXTURE_PORT: '8081'
    volumes:
      - ../..:/workspace:ro
      - ../../../../contracts:/contracts:ro
    expose:
      - '8081'
    networks:
      - private

  caddy:
    image: promptdock-relay-admin:acceptance
    build:
      context: ../../../..
      dockerfile: deploy/docker/Dockerfile
      target: admin-caddy-runtime
      args:
        BUILD_VERSION: ${BUILD_VERSION}
        SOURCE_COMMIT: ${SOURCE_COMMIT}
    depends_on:
      - fixture
    network_mode: service:fixture
    environment:
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}

networks:
  private:
    internal: true
