# Local Docker integration configuration only. The Admin listener is loopback
# scoped; Caddy and the Node verification client join Relay's network namespace.
[server]
bind = "127.0.0.1:8080"
exposure = "loopback"
request_body_limit_bytes = 65536
route_timeout_seconds = 10
shutdown_timeout_seconds = 15

[admin]
enabled = true
bind = "127.0.0.1:8081"
allowed_origin = "https://caddy:8443"
mode = "operator"
route_timeout_seconds = 5
max_page_size = 100

[database]
path = "/var/lib/promptdock-relay/relay.db"
max_connections = 4
busy_timeout_ms = 5000

[wechat]
enabled = false
connection_file = "/var/lib/promptdock-relay/wechat-connection.enc"

[retention]
accepted_days = 30
dead_letter_days = 90
inbound_terminal_days = 7
inbound_expired_days = 2

[logging]
filter = "warn,promptdock_server=warn"
format = "json"
