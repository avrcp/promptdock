[server]
bind = "127.0.0.1:8080"
exposure = "loopback"
notification_only = true
request_body_limit_bytes = 65536
route_timeout_seconds = 10
shutdown_timeout_seconds = 15

[admin]
enabled = true
bind = "127.0.0.1:8081"
allowed_origin = "https://admin.example.com"
mode = "read_only"
route_timeout_seconds = 5
max_page_size = 100

[database]
path = "/var/lib/promptdock-relay/relay.db"
max_connections = 4
busy_timeout_ms = 5000

[wechat]
enabled = true
connection_file = "/var/lib/promptdock-relay/wechat-connection.enc"

[retention]
accepted_days = 30
dead_letter_days = 90
inbound_terminal_days = 7
inbound_expired_days = 2
bundle_content_days = 7

[logging]
filter = "info,promptdock_server=info"
format = "json"

# Enable after configuring the same public HTTPS origin used by Desktop.
# Viewer assets are embedded in the Relay binary; no separate web deployment.
[results]
enabled = false
public_origin = "https://admin.example.com"
share_ttl_days = 7
max_body_bytes = 262144
max_retained_body_bytes = 268435456
